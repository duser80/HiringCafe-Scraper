name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r service/requirements.txt
      - name: Run unit tests
        run: python -m pytest service/tests -k unit -v
        env:
          ADMIN_TOKEN: ci-admin-token-0123456789

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hiringcafe
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: hiringcafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiringcafe -d hiringcafe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r service/requirements.txt
      - name: Run migrations
        run: alembic -c service/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://hiringcafe:ci-password@localhost:5432/hiringcafe
          ADMIN_TOKEN: ci-admin-token-0123456789
      - name: Run full test suite
        run: python -m pytest service/tests -v
        env:
          ADMIN_TOKEN: ci-admin-token-0123456789
          TEST_DATABASE_URL: postgresql+asyncpg://hiringcafe:ci-password@localhost:5432/hiringcafe
          TEST_REDIS_URL: redis://localhost:6379/1

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build -t hiringcafe-api:ci .
